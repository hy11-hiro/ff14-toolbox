<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 Mitigation Planner - Timeline Full Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* レイアウトのズレ防止: 常に左ボーダーを確保 */
        .timeline-row { 
            height: 42px; /* 少し高さを広げてバーを見やすく */
            transition: background 0.1s; 
            border-left: 4px solid transparent; 
        }
        .timeline-row:hover { background-color: rgba(59, 130, 246, 0.05); }
        
        /* 攻撃行のスタイル */
        .is-attack { 
            background-color: rgba(239, 68, 68, 0.08); 
            border-left-color: #ef4444; 
        }
        
        .mit-bar {
            width: 6px;
            height: 100%;
            margin-right: 1px;
            border-radius: 2px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .mit-bar:hover { opacity: 1.0; width: 10px; z-index: 10; }
        
        .job-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            color: white;
            margin-right: 4px;
        }
        .bg-tank { background-color: #2e3d8c; }
        .bg-healer { background-color: #34662d; }
        .bg-dps { background-color: #732828; }
        
        .cell-inner { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            min-height: 42px; 
            display: flex; 
            align-items: center; 
            padding-left: 4px; 
            overflow: hidden;
        }
        
        /* スキルチップのスタイル調整 */
        .skill-chip {
            font-size: 8px;
            padding: 1px 3px;
            border-radius: 2px;
            color: white;
            white-space: nowrap;
            z-index: 20;
            position: relative;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
            text-shadow: 0 1px 1px rgba(0,0,0,0.8);
            margin-right: 2px;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
        }
        .skill-chip:hover { max-width: none; z-index: 50; }

        .skill-chip.on-cooldown {
            background: repeating-linear-gradient(
              45deg,
              #7f1d1d,
              #7f1d1d 5px,
              #991b1b 5px,
              #991b1b 10px
            ) !important;
            border: 1px solid #ef4444 !important;
            opacity: 0.8;
        }

        .duration-bars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: stretch;
            z-index: 0;
            pointer-events: none;
            padding-top: 2px;
            padding-bottom: 2px;
            opacity: 0.5;
        }

        .skills-container {
            z-index: 10;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            pointer-events: none; /* チップの下のクリックを通すため */
        }
        .skills-container > * { pointer-events: auto; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 font-sans text-xs">

        <!-- Sidebar: Config -->
        <aside class="w-72 bg-gray-900 border-r border-gray-800 p-4 flex flex-col no-print shrink-0 z-50 shadow-xl">
            <h1 class="text-xl font-black text-blue-500 mb-4 tracking-tighter italic">MITIGATION PRO <span class="text-[9px] text-gray-500 font-normal not-italic ml-1">v8.0</span></h1>
            
            <div class="mb-4">
                <label class="block text-gray-500 font-bold mb-2 uppercase text-[10px]">Party Setup</label>
                <div id="partySetup" class="grid grid-cols-2 gap-1.5"></div>
            </div>

            <div class="flex-1 flex flex-col overflow-hidden">
                <label class="block text-gray-500 font-bold mb-2 uppercase text-[10px]">Timeline XML (ACT/Speスペタイ)</label>
                <textarea id="logInput" class="flex-1 bg-black border border-gray-800 rounded p-2 font-mono text-[9px] focus:border-blue-500 outline-none mb-3 text-gray-400" placeholder="XMLを貼り付けてください..."></textarea>
                <button onclick="handleGenerate()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded transition shadow-lg text-xs">タイムライン展開</button>
            </div>
            
            <div class="mt-4 pt-4 border-t border-gray-800 flex gap-2">
                <button onclick="saveToLocal()" class="flex-1 bg-gray-800 hover:bg-gray-700 py-2 rounded font-bold text-xs border border-gray-700">保存</button>
                <button onclick="window.print()" class="flex-1 bg-gray-800 hover:bg-gray-700 py-2 rounded font-bold text-xs border border-gray-700">印刷</button>
            </div>
        </aside>

        <!-- Main: Timeline -->
        <main class="flex-1 overflow-auto bg-black relative flex flex-col">
            <div id="tableHeader" class="sticky top-0 z-40 bg-gray-900 border-b border-gray-800 flex items-center shadow-xl h-8 shrink-0">
                <div class="w-12 p-1 text-center border-r border-gray-800 font-bold text-gray-500 shrink-0 text-[10px]">TIME</div>
                <div class="w-56 p-2 font-bold text-gray-400 shrink-0 border-r border-gray-800 text-[10px]">GIMMICK</div>
                <div id="partyHeaders" class="flex flex-1 min-w-0"></div>
            </div>
            <div id="timelineContainer" class="relative flex-1">
                <div id="emptyMsg" class="text-center py-20 text-gray-600">左側のサイドバーにXMLを貼り付けて展開してください</div>
            </div>
        </main>
    </div>

        </div>
        <div id="paletteButtons" class="grid grid-cols-1 gap-1 max-h-80 overflow-y-auto"></div>
    </div>

            RDM: { name: "赤魔道士", role: "dps", skills: [
                {n:"アドル", d:15, r:90, color:"#7c3aed"}, 
                {n:"バマジク", d:15, r:120, color:"#fca5a5"}
            ]},
            PCT: { name: "ピクトマンサー", role: "dps", skills: [
                {n:"アドル", d:15, r:90, color:"#7c3aed"}, 
                {n:"テンペラコート", d:10, r:120, color:"#f472b6"}, 
                {n:"スターリィ・ミューズ", d:20, r:120, color:"#facc15"},

            ]}
        };

        const ROLE_COLORS = { tank: 'bg-tank', healer: 'bg-healer', dps: 'bg-dps' };

        function init() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.party) party = data.party;
                    if (data.input) document.getElementById('logInput').value = data.input;
                    renderPartySelectors(document.getElementById('partySetup'));
                    if (data.input) handleGenerate(data.tableData);
                } catch (e) {
                    renderPartySelectors(document.getElementById('partySetup'));
                }
            } else {
                renderPartySelectors(document.getElementById('partySetup'));
            }
        }

        function renderPartySelectors(container) {
            container.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const select = document.createElement('select');
                select.className = "bg-black border border-gray-800 rounded text-[9px] p-1 outline-none text-gray-300 w-full";
                Object.keys(JOBS).sort().forEach(code => {
                    const opt = document.createElement('option');
                    opt.value = code; opt.textContent = code;
                    select.appendChild(opt);
                });
                select.value = party[i];
                select.onchange = (e) => { 
                    party[i] = e.target.value; 
                    renderTimeline(getCurrentTableData());
                };
                container.appendChild(select);
            }
        }

        function handleGenerate(savedData = null) {
            const raw = document.getElementById('logInput').value.trim();
            if (!raw) return;

            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(raw, "text/xml");
            const activities = Array.from(xmlDoc.getElementsByTagName("a"));
            if (activities.length === 0) return;

            const maxTime = Math.max(...activities.map(a => parseInt(a.getAttribute("time") || 0)));
            
            timelineRows = Array.from({ length: maxTime + 10 }, (_, i) => ({
                time: i,
                text: "",
                isAttack: false,
                sync: ""
            }));

            activities.forEach(a => {
                const t = parseInt(a.getAttribute("time") || 0);
                if (timelineRows[t]) {
                    timelineRows[t].text = a.getAttribute("text") || "";
                    timelineRows[t].isAttack = true;
                    timelineRows[t].sync = a.getAttribute("sync") || "";
                }
            });

            renderTimeline(savedData);
        }

        function renderTimeline(savedData = null) {
            const container = document.getElementById('timelineContainer');
            const pHeaders = document.getElementById('partyHeaders');
            
            container.innerHTML = '';
            pHeaders.innerHTML = '';
            
            party.forEach((code, i) => {
                const h = document.createElement('div');
                h.className = "flex-1 p-2 border-l border-gray-800 text-center flex items-center justify-center font-bold shrink-0";
                h.innerHTML = `<div class="job-icon ${ROLE_COLORS[JOBS[code].role]}">${code}</div>`;
                pHeaders.appendChild(h);
            });

            timelineRows.forEach((row, idx) => {
                const showTime = idx % 5 === 0 || row.isAttack;
                const tr = document.createElement('div');
                tr.className = `flex border-b border-gray-900 timeline-row ${row.isAttack ? 'is-attack' : ''}`;
                tr.dataset.time = row.time;

                let html = `
                    <div class="w-12 flex-none border-r border-gray-800 text-center flex items-center justify-center font-mono text-gray-600 ${showTime ? 'opacity-100' : 'opacity-20'} text-[9px] shrink-0">
                        ${Math.floor(row.time/60)}:${(row.time%60).toString().padStart(2, '0')}
                    </div>
                    <div class="w-56 flex-none p-1 flex flex-col justify-center overflow-hidden shrink-0 border-r border-gray-800">
                        <span class="font-bold text-gray-200 truncate leading-tight pl-2 text-[11px]">${row.text}</span>
                        ${row.sync ? `<span class="text-[8px] text-gray-600 italic truncate pl-2">${row.sync}</span>` : ''}
                    </div>
                `;

                for (let p = 0; p < 8; p++) {
                    const skillVal = (savedData && savedData[idx]) ? savedData[idx][p] : "";
                    html += `
                        <div class="flex-1 border-l border-gray-900 cell-inner min-w-0" onclick="showPalette(this, ${p}, ${idx})">
                            <div class="duration-bars-container"></div>
                            <div class="skills-container">${formatChips(skillVal, party[p])}</div>
                            <input type="hidden" value="${skillVal}">
                        </div>
                    `;
                }
                tr.innerHTML = html;
                container.appendChild(tr);
            });

            recalculateDurationsAndCooldowns();
        }

        function formatChips(val, jobCode) {
            if (!val) return "";
            return val.split(',').map(s => {
                const name = s.trim();
                const skillDef = JOBS[jobCode].skills.find(sk => sk.n === name);
                const color = skillDef ? skillDef.color : '#6b7280';
                return `<span class="skill-chip" style="background-color: ${color}; border-color: ${color};">${name}</span>`;
            }).join('');
        }

        function getSkillStateAtTime(partyIdx, skillName, targetTime) {
            const jobCode = party[partyIdx];
            const skillDef = JOBS[jobCode].skills.find(s => s.n === skillName);
            if (!skillDef) return { available: true, stacks: 0, max: 0 };

            const maxStacks = skillDef.c || 1;
            const recast = skillDef.r || 0;
            
            // 正確なスタック回復シミュレーション
            // cooldowns: 各スタックがいつ戻ってくるかのタイムスタンプ配列
            // 初期状態はすべて 0 (使用可能)
            let cooldowns = Array(maxStacks).fill(-9999); 
            
            const rows = document.querySelectorAll('.timeline-row');
            
            // ターゲットタイムまでの履歴をシミュレート
            for (let i = 0; i < targetTime; i++) {
                if (!rows[i]) break;
                const cell = rows[i].querySelectorAll('.cell-inner')[partyIdx];
                const input = cell.querySelector('input');
                if (!input || !input.value) continue;

                const usedSkills = input.value.split(',').map(s => s.trim());
                if (usedSkills.includes(skillName)) {
                    // 使用するスタックを探す（現在時刻 i 以前に戻っているものの中で、一番早く戻ったものを使う）
                    // cooldownsをソートして、一番小さい値（一番早く使えるようになるやつ）を使う
                    cooldowns.sort((a, b) => a - b);
                    
                    if (cooldowns[0] <= i) {
                        // 使用可能。このスタックの次回使用可能時刻を更新
                        cooldowns[0] = i + recast;
                    } else {
                        // 使用不可なのに使っている（エラー状態）だが、シミュレーション上は無理やり消費させる
                        cooldowns[0] = i + recast; 
                    }
                }
            }

            // 現在(targetTime)の状態を確認
            cooldowns.sort((a, b) => a - b);
            const availableStacks = cooldowns.filter(t => t <= targetTime).length;
            
            return { available: availableStacks > 0, stacks: availableStacks, max: maxStacks, recast: recast };
        }

        function recalculateDurationsAndCooldowns() {
            document.querySelectorAll('.duration-bars-container').forEach(c => c.innerHTML = '');
            document.querySelectorAll('.skill-chip').forEach(c => c.classList.remove('on-cooldown'));
            
            const rows = document.querySelectorAll('.timeline-row');
            
            // 各メンバー、各スキルのCooldown状態管理
            // history: partyIdx -> skillName -> [readyTime1, readyTime2, ...]
            const partyState = party.map(jobCode => {
                const skillsState = {};
                JOBS[jobCode].skills.forEach(s => {
                    // 初期状態: 全スタックがTime -9999で使用可能
                    skillsState[s.n] = Array(s.c || 1).fill(-9999);
                });
                return skillsState;
            });

            rows.forEach((row, rIdx) => {
                const cells = row.querySelectorAll('.cell-inner');
                cells.forEach((cell, pIdx) => {
                    const val = cell.querySelector('input').value;
                    const container = cell.querySelector('.duration-bars-container');
                    
                    if (val) {
                        const chips = cell.querySelectorAll('.skill-chip');
                        const usedSkills = val.split(',').map(s => s.trim());

                        usedSkills.forEach((skillName, sIdx) => {
                            const jobCode = party[pIdx];
                            const skillDef = JOBS[jobCode].skills.find(s => s.n === skillName);
                            if (!skillDef) return;

                            // Cooldown判定
                            const cooldowns = partyState[pIdx][skillName];
                            cooldowns.sort((a, b) => a - b); // 早く戻る順

                            if (cooldowns[0] <= rIdx) {
                                // 使用可能: 消費して次回使用可能時刻を設定
                                cooldowns[0] = rIdx + skillDef.r;
                            } else {
                                // 使用不可
                                if (chips[sIdx]) chips[sIdx].classList.add('on-cooldown');
                                // 無理やり消費
                                cooldowns[0] = rIdx + skillDef.r;
                            }

                            // 効果時間のバー描画 (この行からd秒後まで)
                            if (skillDef.d > 0) {
                                for (let i = 0; i < skillDef.d; i++) {
                                    const targetIdx = rIdx + i;
                                    if (targetIdx < rows.length) {
                                        const targetCell = rows[targetIdx].querySelectorAll('.cell-inner')[pIdx];
                                        const targetContainer = targetCell.querySelector('.duration-bars-container');
                                        
                                        const bar = document.createElement('div');
                                        bar.className = `mit-bar`;
                                        bar.style.backgroundColor = skillDef.color;
                                        bar.title = skillDef.n; // Hover text
                                        targetContainer.appendChild(bar);
                                    }
                                }
                            }
                        });
                    }
                });
            });
        }

        function showPalette(div, partyIdx, rowIdx) {
            const code = party[partyIdx];
            const job = JOBS[code];
            const palette = document.getElementById('skillPalette');
            const btns = document.getElementById('paletteButtons');
            const hidden = div.querySelector('input');
            
            document.getElementById('paletteJobName').textContent = `${job.name} (${code})`;
            btns.innerHTML = '';

            job.skills.forEach(skill => {
                const state = getSkillStateAtTime(partyIdx, skill.n, rowIdx);
                
                const b = document.createElement('button');
                const isAvailable = state.available;
                
                b.className = `text-left px-2 py-2 text-[10px] rounded flex justify-between items-center w-full mb-1 border ${isAvailable ? 'bg-gray-800 hover:bg-blue-900 border-gray-700' : 'bg-gray-900 text-gray-500 border-gray-800 cursor-not-allowed'}`;
                
                let stackInfo = '';
                if ((skill.c || 1) > 1 || state.recast > 0) {
                    const colorClass = state.stacks > 0 ? 'text-green-400' : 'text-red-500';
                    stackInfo = `<span class="${colorClass} ml-2 font-mono">[${state.stacks}/${state.max}]</span>`;
                }

                b.innerHTML = `
                    <div class="flex items-center">
                        <div class="w-2 h-2 rounded-full mr-2" style="background-color: ${skill.color}"></div>
                        <span class="font-bold">${skill.n}</span>
                    </div>
                    <div class="flex items-center">
                        <span class="text-[9px] text-gray-400 mr-1">${skill.r}s</span>
                        ${stackInfo}
                    </div>
                `;
                
                b.onclick = (e) => {
                    e.stopPropagation();
                    const current = hidden.value;
                    const valToAdd = skill.n;
                    
                    // 重複チェックはせず、ユーザーの操作を優先
                    hidden.value = current ? `${current}, ${valToAdd}` : valToAdd;
                    div.querySelector('.skills-container').innerHTML = formatChips(hidden.value, code);
                    palette.classList.add('hidden');
                    recalculateDurationsAndCooldowns();
                };
                btns.appendChild(b);
            });

            // Clear Button
            const clear = document.createElement('button');
            clear.className = "w-full text-center text-[9px] text-red-500 hover:text-red-400 mt-2 border-t border-gray-700 pt-1";
            clear.textContent = "Remove All";
            clear.onclick = (e) => {
                e.stopPropagation();
                hidden.value = "";
                div.querySelector('.skills-container').innerHTML = "";
                palette.classList.add('hidden');
                recalculateDurationsAndCooldowns();
            };
            btns.appendChild(clear);

            const rect = div.getBoundingClientRect();
            if (rect.bottom + 300 > window.innerHeight) {
                palette.style.top = `${rect.top - palette.offsetHeight}px`;
            } else {
                palette.style.top = `${rect.bottom}px`;
            }
            if (rect.left + 260 > window.innerWidth) {
                 palette.style.left = `${window.innerWidth - 270}px`;
            } else {
                 palette.style.left = `${rect.left}px`;
            }
            
            palette.classList.remove('hidden');
        }

        function getCurrentTableData() {
            return Array.from(document.querySelectorAll('.timeline-row')).map(row => 
                Array.from(row.querySelectorAll('.cell-inner input')).map(input => input.value)
            );
        }

        function saveToLocal() {
            const input = document.getElementById('logInput').value;
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ input, tableData: getCurrentTableData(), party }));
            alert("保存しました");
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#skillPalette') && !e.target.closest('.cell-inner')) {
                document.getElementById('skillPalette').classList.add('hidden');
            }
        });

        init();
    </script>
</body>
</html>
